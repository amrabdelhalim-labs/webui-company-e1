<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة عربي | إضافة تدوينة</title>
</head>
<body>
    <div class="container-fluid">
        <section class="top-menu">
            <div class="row">
                <nav class="navbar navbar-expand-lg bg-body-tertiary">
                    <div class="container-fluid">
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#top-navbar" aria-controls="top-navbar" aria-expanded="false" aria-label="Toggle navigation">
                            <i class="fa-solid fa-bars"></i>
                        </button>
        
                        <a href="index.html" class="navbar-brand p-0">
                            <img src="images/logo.png" alt="شركة عربي" class="d-inline-block align-text-top">
                        </a>
        
                        <div class="collapse navbar-collapse" id="top-navbar">
                            <ul class="navbar-nav me-auto mb-2 mb-lg-0 p-2">
                                <li class="nav-item">
                                    <a class="nav-link active" aria-current="page" href="index.html">الرئيسية</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="about.html">عن الشركة</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="projects.html">مشاريعنا</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="blog.html">المدونة</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" href="contact.html">تواصل معنا</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
            </div>
        </section>        

        <section class="banner banner-blog">
            <div class="row">
                <div class="col-12">
                    <div id="banner-img">
                        <div class="overlay">
                            <h1 class="title1">إضافة تدوينة</h1>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="add-blog mt-4 mb-4">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-7">
                        <form>
                            <div class="row mt-4">
                                <div class="col-md-6">
                                    <label>عنوان التدوينة</label>
                                    <input type="text" class="form-control mb-3">
                                </div>
                                <div class="col-md-6">
                                    <label>الصورة</label>
                                    <div class="custom-file">
                                        <input type="file" class="custom-file-input" id="customFile">
                                        <label class="custom-file-label" for="customFile">إختر صورة</label>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col">
                                    <label class="mt-4">تفاصيل التدوينة</label>
                                    <textarea name="message" required placeholder="النص" cols="30" rows="5" class="form-control"></textarea>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-light custom-btn mt-4">إضافة التدوينة</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <footer>
          <div class="row">
              <div class="col-12 text-center">
                  <h2 class="mt-5">شركة عربي</h2>
                  <hr class="line1">
              </div>
               <div id="footer-nav-links" class="col-12 text-center mt-2">
                  <a href="index.html">الصفحة الرئيسية</a>
                  <a href="about.html">من نحن</a>
                  <a href="projects.html">المشاريع السابقة</a>
                  <a href="blog.html">المدونة</a>
                  <a href="contact.html">تواصل معنا</a>
              </div>
              <hr class="line2">
              <div class="col-12 text-center">
                <label class="custom-heading text-white mb-3">اشترك بالنشرة البريدية</label>
                <form class="form d-flex align-items-center justify-content-center">
                  <div class="input-group input-group-lg mb-3">
                    <input type="email" class="form-control" placeholder="البريد الإلكتروني" aria-label="البريد الإلكتروني" aria-describedby="button-addon1">
                    <button class="btn btn-light" type="button" id="button-addon1">متابعة</button>
                  </div>
                </form>
              </div>
              <hr class="line2">
              <div class="col-12 text-center">
                <a class="copyright-link copyright" href="index.html">
                  شركة عربي لتطوير وتصميم المواقع والتطبيقات
                </a>
                <h5 class="copyright mt-2">
                  جميع الحقوق محفوظة شركة عربي &copy; <span id="date"></span>
                </h5>
            </div>
          </div>
        </footer>
    </div>
</body>
</html>
